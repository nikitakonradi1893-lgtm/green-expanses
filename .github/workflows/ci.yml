name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  core-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore GreenExpanses.sln
      - name: Build
        run: dotnet build GreenExpanses.sln --configuration Release --no-restore
      - name: Unit and integration tests
        run: dotnet test GreenExpanses.sln --configuration Release --no-build
      - name: Deterministic 365-day fixture
        run: dotnet test tests/GreenExpanses.Tests/GreenExpanses.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~Core011VerticalFixtureTests"
      - name: Runtime config validation
        run: dotnet run --project src/GreenExpanses.Tools --configuration Release --no-build -- --validate-config data/config
      - name: Headless CLI reproducibility smoke
        shell: bash
        run: |
          dotnet run --project src/GreenExpanses.Tools --configuration Release --no-build -- --seed 20260910 --days 365 > run-a.txt
          dotnet run --project src/GreenExpanses.Tools --configuration Release --no-build -- --seed 20260910 --days 365 > run-b.txt
          diff -u run-a.txt run-b.txt
